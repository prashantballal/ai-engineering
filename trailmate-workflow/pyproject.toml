[project]
name = "trailmate-workflow"
version = "0.1.0"
description = "TrailMate Phase 1: a deterministic LangGraph workflow service (FastAPI, LiteLLM tiers over Ollama, SSE streaming, guardrails)"
readme = "README.md"
authors = [
    { name = "Prashant Ballal", email = "prashantballal@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.164.0",
    "httpx>=0.28.1",
    "langchain-core>=1.8.3",
    "langchain-openai>=1.8.2",
    "langgraph>=1.2.22",
    "pydantic-settings>=2.16.3",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
trailmate = "trailmate_workflow.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs the LiteLLM proxy + Ollama running (RUN_INTEGRATION=1)"]
filterwarnings = [
    # Third-party noise on Python 3.14: langsmith (pulled in by langchain-core) still calls
    # asyncio.iscoroutinefunction. Filtered by exact message, so new warnings still show.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
